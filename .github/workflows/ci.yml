name: BugHunt CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bughunt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, filter, mbstring, openssl, pdo, pdo_pgsql, pdo_sqlite, tokenizer, xml
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Setup npm 12.2.1
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund

      - name: Show runtime versions
        run: |
          php -v
          node -v
          npm -v
          composer --version

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Audit PHP dependencies
        run: composer audit --locked --format=summary

      - name: Prepare Laravel application
        run: |
          php artisan key:generate --force
          php artisan config:clear

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test --colors=always
